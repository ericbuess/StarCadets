name: Deploy StarCadets to GitHub Pages

# Build locally, push when ready → this Action builds + deploys to the CDN.
# The kids' game lives at https://ericbuess.github.io/StarCadets/ and stays up
# independent of the dev Mac (Eric S1375: "star cadets is played by my kids and
# can't go down").

on:
  push:
    branches: [main, master]
    paths-ignore: ['**.md', 'BACKLOG.md', 'plan.md']
  workflow_dispatch:

# Opt every JS action into Node 24 ahead of GitHub's 2026-06-16 forced cutover
# (silences the Node 20 deprecation warnings; future-proofs the deploy).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build (GitHub Pages base path)
        env:
          GHPAGES: '1'
        run: bun run build
      - name: SPA fallback (serve index.html for any client route)
        run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
